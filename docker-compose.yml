services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rtc
      POSTGRES_PASSWORD: rtc
      POSTGRES_DB: rtc
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  coturn:
    image: coturn/coturn:latest
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
    command: >
      turnserver
      -n
      --log-file=stdout
      --listening-port=3478
      --fingerprint
      --lt-cred-mech
      --user=rtc:rtc-turn-secret
      --realm=rtc.local
      --no-cli
      --no-tls
      --no-dtls
      --external-ip=127.0.0.1

volumes:
  pg_data:
  redis_data:
