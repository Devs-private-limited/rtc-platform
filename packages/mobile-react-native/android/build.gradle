apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace "com.rtcexpress.reactnative"
    compileSdk 34

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "com.facebook.react:react-android:+"
    // Native SDK sources are synced into src/main/java/com/rtcexpress/sdk by
    // scripts/sync-native-sdks.mjs; these are its dependencies.
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "io.github.haiyangwu:mediasoup-client:3.4.0"
}
