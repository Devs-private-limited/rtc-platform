name: rtcexpress
description: Flutter plugin for RTC Platform — wraps native Android/iOS SDKs.
version: 0.1.0
homepage: https://github.com/Devs-private-limited/rtc-platform

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.rtcexpress.flutter
        pluginClass: RtcExpressPlugin
      ios:
        pluginClass: RtcExpressPlugin
